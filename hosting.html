<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntrxi - Minecraft Hosting Index</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0b0d;
            --surface-card: #121418;
            --surface-card-hover: #181b22;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(139, 92, 246, 0.3);
            --text-main: #ecebe4;
            --text-muted: #8e939d;
            
            --accent-violet: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-pill: #ecebe4;
            --accent-pill-text: #0a0b0d;
            
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Ambient Lighting Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Noise Overlay */
        .grain-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
            opacity: 0.04;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- HERO FRAME --- */
        .hero-section {
            padding: 16px;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-card {
            position: relative;
            width: 100%;
            min-height: 380px;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 40px 40px 40px;
            border: 1px solid var(--border-color);
            background: 
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.25) 0%, rgba(10, 11, 13, 0.95) 65%),
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.2) 0%, rgba(10, 11, 13, 0.95) 70%),
                var(--surface-card);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* FLOATING NAV BAR */
        .nav-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .nav-pill {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 10px 32px;
            border-radius: 999px;
            background: rgba(18, 20, 24, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-pill a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.8;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .nav-pill a:hover, .nav-pill a.active {
            opacity: 1;
            transform: translateY(-1px);
        }

        /* HERO CONTENT */
        .search-hero-content {
            max-width: 720px;
            margin: 30px auto 0;
            text-align: center;
            z-index: 5;
            width: 100%;
        }

        .brand-heading {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.04em;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        .brand-heading span {
            color: var(--accent-violet);
            font-weight: 300;
        }

        .hero-subtext {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 28px;
            font-weight: 300;
        }

        /* SEARCH BAR */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 16px 24px;
            padding-right: 50px;
            font-size: 0.95rem;
            font-family: var(--font-body);
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(18, 20, 24, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-violet);
            background: rgba(18, 20, 24, 0.9);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* --- CONTROLS & FILTERS --- */
        .controls-container {
            max-width: 1280px;
            margin: 32px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .controls-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-right: 4px;
        }

        .pill-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-body);
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pill-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .pill-btn.active {
            background: var(--accent-pill);
            color: var(--accent-pill-text);
            border-color: var(--accent-pill);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(236, 235, 228, 0.2);
        }

        /* --- HOSTING GRID --- */
        .content-container {
            max-width: 1280px;
            margin: 28px auto 60px;
            padding: 0 20px;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .result-count {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .host-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .host-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-4px);
            background: var(--surface-card-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(139, 92, 246, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
            gap: 12px;
        }

        .host-name {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .badge-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .type-badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .badge-web {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .badge-self {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-free {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-paid {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .specs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .spec-label {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-value {
            font-weight: 600;
            font-family: monospace;
            color: var(--text-main);
        }

        .cpu-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cpu-box i {
            color: var(--accent-violet);
        }

        .cpu-text {
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* --- FOOTER --- */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 20px;
            background: var(--bg-dark);
            margin-top: auto;
            position: relative;
            z-index: 1;
        }

        .footer-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--text-main);
        }

        .copyright {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* --- INLINE SVG ICONS (no icon font needed) --- */
        .ico {
            width: 1em;
            height: 1em;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -0.125em;
            flex-shrink: 0;
        }
        i[data-icon] { display: inline-flex; align-items: center; font-style: normal; }
        .control-label { display: inline-flex; align-items: center; gap: 6px; }

        /* --- FEATURE TAGS --- */
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .feat-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .feat-yes { background: rgba(34, 197, 94, 0.12); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        .feat-no { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
        .feat-unk { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); }
        .feat-host { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }

        .pill-btn .ico { width: 14px; height: 14px; }

        /* --- PLANS LIST --- */
        .plans {
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }
        .plans summary {
            cursor: pointer;
            list-style: none;
            padding: 10px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plans summary::-webkit-details-marker { display: none; }
        .plans summary::after { content: '+'; margin-left: auto; color: var(--text-muted); font-size: 1rem; }
        .plans[open] summary::after { content: '\2212'; }
        .plan-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }
        .plan-name { font-weight: 600; color: var(--text-main); }
        .plan-desc { color: var(--text-muted); margin-top: 2px; font-size: 0.75rem; line-height: 1.35; }
        .plan-price { font-family: monospace; font-weight: 600; color: #fbbf24; text-align: right; white-space: nowrap; }
        .plans-note { padding: 8px 14px 12px; font-size: 0.7rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); }

        /* RESPONSIVE DESIGN */
        @media (max-width: 850px) {
            .hero-card {
                padding: 20px 20px 32px 20px;
            }
            .controls-card {
                flex-direction: column;
                align-items: stretch;
            }
            .control-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-pill {
                gap: 16px;
                padding: 8px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

    const featureFilters = { cracked: false, always247: false };

    function crackedTag(v) {
        if (v === true) return '<span class="feat-tag feat-yes">' + icon('unlock') + ' Cracked: Yes</span>';
        if (v === false) return '<span class="feat-tag feat-no">' + icon('unlock') + ' Cracked: No</span>';
        return '<span class="feat-tag feat-unk">' + icon('unlock') + ' Cracked: Unconfirmed</span>';
    }

    function tag247(v) {
        if (v === true) return '<span class="feat-tag feat-yes">' + icon('clock') + ' 24/7: Yes</span>';
        if (v === false) return '<span class="feat-tag feat-no">' + icon('clock') + ' 24/7: No</span>';
        if (v === 'host') return '<span class="feat-tag feat-host">' + icon('clock') + ' 24/7: Depends on your PC</span>';
        return '<span class="feat-tag feat-unk">' + icon('clock') + ' 24/7: Unconfirmed</span>';
    }

    function plansBlock(item) {
        if (!item.plans || !item.plans.length) return '';
        const rows = item.plans.map(pl => `
            <div class="plan-row">
                <div>
                    <div class="plan-name">${pl.n}</div>
                    <div class="plan-desc">${pl.d}</div>
                </div>
                <div class="plan-price">${pl.p}</div>
            </div>`).join('');
        const note = item.planNote ? `<div class="plans-note">${item.planNote}</div>` : '';
        return `<details class="plans"><summary>${icon('list')} Plans (${item.plans.length})</summary>${rows}${note}</details>`;
    }

    function render() {
        const listContainer = document.getElementById("host-list");
        const countEl = document.getElementById("result-count");
        
        // 1. Filter by pricing, category, features & search query
        let filtered = masterList.filter(item => {
            const matchesType = currentFilter === 'all' || item.type === currentFilter;
            const matchesPricing = currentPricing === 'all' || item.pricing === currentPricing;
            const matchesCracked = !featureFilters.cracked || item.cracked === true;
            const matches247 = !featureFilters.always247 || item.always247 === true;
            const matchesSearch = item.name.toLowerCase().includes(searchQuery) || 
                                  item.cpu.toLowerCase().includes(searchQuery) ||
                                  (item.displayRam && item.displayRam.toLowerCase().includes(searchQuery));
            return matchesType && matchesPricing && matchesCracked && matches247 && matchesSearch;
        });

        // 2. Sort data
        if (currentSort === 'ram-desc') {
            filtered.sort((a, b) => b.ram - a.ram);
        } else if (currentSort === 'ram-asc') {
            filtered.sort((a, b) => a.ram - b.ram);
        } else if (currentSort === 'name') {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        }

        countEl.textContent = filtered.length + (filtered.length === 1 ? ' result' : ' results');

        // 3. Handle Empty
        if (filtered.length === 0) {
            listContainer.innerHTML = '<div class="empty-state"><p>No hosting services match your search criteria.</p></div>';
            return;
        }

        // 4. Render Grid Cards
        listContainer.innerHTML = filtered.map(item => `
            <div class="host-card">
                <div>
                    <div class="card-header">
                        <h3 class="host-name">${item.name}</h3>
                        <div class="badge-stack">
                            <span class="type-badge ${item.pricing === 'paid' ? 'badge-paid' : 'badge-free'}">
                                ${item.pricing === 'paid' ? 'Paid' : 'Free'}
                            </span>
                            <span class="type-badge ${item.type === 'web' ? 'badge-web' : 'badge-self'}">
                                ${item.type === 'web' ? 'Web Host' : 'Tool / Mod'}
                            </span>
                        </div>
                    </div>

                    <div class="tag-row">
                        ${crackedTag(item.cracked)}
                        ${tag247(item.always247)}
                    </div>

                    <div class="specs-list">
                        <div class="spec-item">
                            <span class="spec-label">${icon('ram')} RAM</span>
                            <span class="spec-value">${item.displayRam ? item.displayRam : item.ram + ' GB'}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">${icon('storage')} Storage</span>
                            <span class="spec-value">${item.storage}</span>
                        </div>
                    </div>

                    ${plansBlock(item)}
                </div>

                <div class="cpu-box">
                    ${icon('cpu')}
                    <span class="cpu-text" title="${item.cpu}">${item.cpu}</span>
                </div>
            </div>
        `).join('');
    }

    function filterType(type, btnElement) {
        currentFilter = type;
        document.querySelectorAll('#categoryGroup .pill-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        render();
    }

    function filterPricing(pricing, btnElement) {
        currentPricing = pricing;
        document.querySelectorAll('#pricingGroup .pill-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        render();
    }

    function toggleFeature(key, btnElement) {
        featureFilters[key] = !featureFilters[key];
        btnElement.classList.toggle('active', featureFilters[key]);
        render();
    }

    function sortData(criteria, btnElement) {
        currentSort = criteria;
        document.querySelectorAll('#sortGroup .pill-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        render();
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
        render();
    }

    window.onload = () => { hydrateIcons(); render(); };
    </script>

</body>
</html>
